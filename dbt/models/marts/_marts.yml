version: 2

models:
  - name: dim_maquina
    description: >
      Dimensão de máquina: uma linha por máquina, com a fonte, a data de cadastro e os totais
      de leituras e falhas (agregados a partir de int_leituras_enriquecidas). Base para
      filtrar e agrupar nas consultas dos marts.
    columns:
      - name: id_maquina
        description: Identificador da máquina (chave da dimensão).
        data_tests:
          - unique
          - not_null
      - name: fonte
        description: Origem dos dados da máquina ('ai4i' ou 'simulado').
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ai4i", "simulado"]
      - name: criada_em
        description: Momento em que a máquina foi cadastrada no banco.
        data_tests:
          - not_null
      - name: total_leituras
        description: Quantidade de leituras da máquina (0 se ainda não tiver leituras).
        data_tests:
          - not_null
      - name: total_falhas
        description: Quantidade de leituras com falha da máquina (0 se nunca falhou).
        data_tests:
          - not_null

  - name: fct_leituras
    description: >
      Fato de leituras: uma linha por leitura de sensores, com medições, indicador de falha
      e modos agregados. Aponta para dim_maquina via id_maquina (star schema).
    columns:
      - name: id_leitura
        description: Identificador da leitura (chave do fato; grain = 1 linha por leitura).
        data_tests:
          - unique
          - not_null
      - name: id_maquina
        description: Máquina que fez a leitura (chave estrangeira para dim_maquina).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_maquina')
                field: id_maquina
      - name: medido_em
        description: Instante da leitura.
        data_tests:
          - not_null
      - name: tipo_produto
        description: Variante do produto (L, M ou H).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["L", "M", "H"]
      - name: temperatura_ar_c
        description: Temperatura do ar em Celsius.
      - name: temperatura_processo_c
        description: Temperatura do processo em Celsius.
      - name: rotacao_rpm
        description: Rotação do eixo em rpm.
      - name: torque_nm
        description: Torque em newton-metro.
      - name: desgaste_min
        description: Desgaste acumulado da ferramenta em minutos.
      - name: houve_falha
        description: Verdadeiro se a máquina falhou nesta leitura.
      - name: modos_falha
        description: >
          Modos de falha agregados em texto, em ordem alfabética (ex.: 'HDF, PWF').
          Nulo quando não houve falha.
      - name: qtd_modos_falha
        description: Quantidade de modos de falha da leitura (0 quando não houve falha).

  - name: fct_falhas_diarias
    description: >
      Fato agregado: uma linha por máquina e por dia com falha(s). Conta as leituras com
      falha (qtd_falhas) e lista os conjuntos de modos distintos do dia. A unicidade da
      chave (id_maquina, data_ref) é garantida pelo teste singular
      fct_falhas_diarias_chave_unica (sem dbt_utils).
    columns:
      - name: id_maquina
        description: Máquina (chave estrangeira para dim_maquina).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_maquina')
                field: id_maquina
      - name: data_ref
        description: Dia da falha (medido_em::date).
        data_tests:
          - not_null
      - name: qtd_falhas
        description: Quantidade de leituras com falha naquele dia para a máquina.
        data_tests:
          - not_null
      - name: modos_falha
        description: >
          Conjuntos de modos distintos do dia, separados por '; ' (cada conjunto já vem
          agregado por leitura, ex.: 'HDF, PWF').
