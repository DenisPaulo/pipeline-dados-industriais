# Projeto dbt da V2: transforma, dentro do PostgreSQL, as tabelas carregadas pelo pipeline Python.
name: pipeline_dados_industriais
version: "0.1.0"
config-version: 2

# Nome do "perfil" de conexão (definido em profiles.yml)
profile: pipeline_dados_industriais

# Onde o dbt procura cada tipo de arquivo (caminhos relativos a esta pasta)
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Pastas geradas pelo dbt (estão no .gitignore)
clean-targets: ["target", "dbt_packages"]

models:
  pipeline_dados_industriais:
    staging:
      # Staging = limpeza leve de nomes e tipos, sem regra de negócio.
      # Vira VIEW (não guarda dados, só uma consulta salva) no schema "staging".
      +materialized: view
      +schema: staging
    intermediate:
      # Intermediate = junta e enriquece os dados do staging, ainda sem métricas finais.
      # VIEW (e não table) porque o volume é pequeno (~24 mil linhas) e a view sempre reflete
      # os dados atuais. Se ficar lenta quando os dados crescerem, troque para `table`.
      +materialized: view
      +schema: intermediate
    marts:
      # Marts = tabelas finais para consulta (painel, SQL ad hoc). Materializadas como TABLE
      # porque são o destino: leitura frequente, cálculo feito uma vez no `dbt build`.
      # Dimensões (dim_*) descrevem entidades; fatos (fct_*) virão nas próximas etapas.
      +materialized: table
      +schema: marts
