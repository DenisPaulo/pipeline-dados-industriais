[project]
name = "pipeline-dados-industriais"
version = "0.1.0"
description = "Pipeline ETL educacional de sensores industriais: Parquet, limpeza e carga idempotente em PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "painel"]
# O ruff 0.16 também formata blocos de código dentro de arquivos Markdown. Os trechos do guia de estudo
# são excertos didáticos com comentários alinhados à mão, então docs/ fica fora da verificação.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/W: estilo pycodestyle; F: pyflakes; I: ordem dos imports; B: bugs comuns; UP: sintaxe moderna
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: exige um PostgreSQL real (variáveis POSTGRES_*); rode com `make test-integration`",
]
